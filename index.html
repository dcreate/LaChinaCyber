<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>La China Cyber</title>

  <meta name="viewport" content="width=device-width,user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<link href="img/drago.jpg" rel="icon">
	<meta property="og:site_name" content="Cyber La China">
	<meta property="og:title" content="La China Cyber">
	<meta property="og:description" content="Ciber y papeleria, copias, impresiones">
	<meta property="og:image" content="https://dcreate.github.io/LaChinaCyber/img/drago.jpg">
	<meta property="og:url" content="https://dcreate.github.io/LaChinaCyber/">
	<meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="estilo.css" />
</head>
<body>

  <div class="card">

    <h1>💳 Datos de tarjeta</h1>


    <!-- =========================
         TITULAR
         ========================= -->

    <div class="dato">

      <span class="etiqueta">
        TITULAR
      </span>

      <div class="valor" id="titular">
        Cargando...
      </div>

      <button
        class="boton"
        id="botonTitular"
        onclick="copiarDato('titular', 'botonTitular', 'Titular copiado')">

        📋 Copiar nombre

      </button>

    </div>


    <!-- =========================
         TARJETA
         ========================= -->

    <div class="dato">

      <span class="etiqueta">
        NÚMERO DE TARJETA
      </span>

      <div class="valor" id="numero">
        Cargando...
      </div>

      <button
        class="boton"
        id="botonTarjeta"
        onclick="copiarDato('numero', 'botonTarjeta', 'Número copiado')">

        📋 Copiar número

      </button>

    </div>


    <div id="mensaje"></div>


    <!-- =========================
         QR
         ========================= -->

    <div class="qr">

      <h3>📱 Escanea el código QR</h3>

      <img
        id="qrImagen"
        alt="Código QR">

    </div>


    <div class="aviso">
      Mantén esta información privada y compártela
      únicamente con personas de confianza.
    </div>

  </div>
</body>
</html>
